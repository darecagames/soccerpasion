name: Publicar SoccerPasion

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v6
      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Comprobar TypeScript
        run: npm run typecheck
      - name: Probar simulacion y teclado
        run: npm test
      - name: Compilar para darecagames.com/soccerpasion/
        run: npm run build-nolog -- --base=/soccerpasion/
      - name: Preparar Pages
        uses: actions/configure-pages@v5
      - name: Guardar el juego compilado
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar el juego
        id: deployment
        uses: actions/deploy-pages@v4
